<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    color: #000000;
    font-family: "Silkscreen", monospace;
    font-size: 13px;
    line-height: 2;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    -webkit-font-smoothing: none;
    font-smooth: never;
    image-rendering: pixelated;
    user-select: none;
  }
  #stage {
    max-width: 520px;
    padding: 40px 24px;
    text-align: left;
    width: 100%;
    box-sizing: border-box;
  }
  #stage img {
    display: block;
    max-width: 100%;
    margin: 26px auto 0;
    opacity: 0;
    transition: opacity 2.5s ease;
    image-rendering: pixelated;
    filter: contrast(1.1);
  }
  #stage img.show { opacity: 1; }
  .blink { animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .flicker { animation: flicker 4s infinite; }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.2; }
  }
  .dim { color: #888; }
  .red { color: #a00000; }
  .hint { color: #aaa; font-size: 11px; margin-top: 24px; }
  .gap { display: block; height: 18px; }
  input[type="text"] {
    background: #fff;
    border: none;
    border-bottom: 1px solid #000;
    color: #000;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 0;
    text-align: left;
    letter-spacing: 3px;
    outline: none;
    margin-top: 14px;
    width: 160px;
  }
  button {
    background: #fff;
    border: 1px solid #000;
    color: #000;
    font-family: inherit;
    font-size: 12px;
    padding: 8px 18px;
    cursor: pointer;
    margin-top: 14px;
    letter-spacing: 2px;
  }
  button:active { background: #000; color: #fff; }
  .wrong { color: #a00000; margin-top: 14px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ===============================
   ARG STAGES
   =============================== */

const stage = document.getElementById('stage');

let visits = parseInt(localStorage.getItem('visits') || '0', 10) + 1;
localStorage.setItem('visits', visits);

const now = Date.now();
const last = parseInt(localStorage.getItem('lastVisit') || '0', 10);
localStorage.setItem('lastVisit', now);

const tooFast = last && (now - last) < 15000;

/* ===============================
   КОНТЕНТ
   =============================== */

const pages = {

  1: `
    <span class="dim">ты здесь.</span><br>
    я знал, что ты придёшь.<span class="gap"></span>
    не помнишь?<br>
    это нормально.<br>
    <span class="dim">они все сначала не помнят.</span>
  `,

  2: `
    ты вернулся.<span class="gap"></span>
    <span class="dim">я говорил тебе не возвращаться.</span><br>
    <span class="blink">но ты здесь.</span><span class="gap"></span>
    третий раз будет последним.
  `,

  3: `
    хорошо.<span class="gap"></span>
    посмотри на это.<span class="gap"></span>
    <span class="hint">сохрани файл. открой. не глазами.</span>
    <img id="img3" src="secret.png" alt="">
  `,

  4: `
    ты снова здесь.<span class="gap"></span>
    <span class="dim">зачем ты пришёл?</span><span class="gap"></span>
    я же предупреждал.<br>
    <span class="dim">четыре — не то, что ты ищешь.</span><span class="gap"></span>
    <span class="red">вернись к третьему.</span>
    <img id="img4" src="fake.png" alt="">
  `,

  5: `
    ты нашёл.<span class="gap"></span>
    теперь введи.<span class="gap"></span>
    <input type="text" id="answer" autocomplete="off" spellcheck="false"><br>
    <button id="submit">дальше</button>
    <div id="feedback"></div>
  `
};

const finalText = `
  ты это сделал.<span class="gap"></span>
  остальные — нет.<span class="gap"></span>
  завтра ты забудешь.<br>
  мы — нет.<span class="gap"></span>
  <span class="dim">три — истина.</span><br>
  <span class="dim">четыре — ложь.</span><span class="gap"></span>
  <span class="flicker">ты выбрал правильно.</span>
`;

/* ===============================
   ОТРИСОВКА
   =============================== */

const text = pages[visits] || finalText;
stage.innerHTML = text;

if (visits === 3) {
  const img = document.getElementById('img3');
  if (img) {
    setTimeout(() => img.classList.add('show'), 700);
    img.onerror = () => {
      stage.innerHTML += `<div class="hint">файл не найден.</div>`;
    };
  }
}

if (visits === 4) {
  const img = document.getElementById('img4');
  if (img) {
    setTimeout(() => img.classList.add('show'), 700);
    img.onerror = () => {
      stage.innerHTML += `<div class="hint">файл не найден.</div>`;
    };
  }
}

if (visits >= 5) {
  const btn = document.getElementById('submit');
  const input = document.getElementById('answer');
  const fb = document.getElementById('feedback');

  if (btn && input) {
    btn.addEventListener('click', () => {
      const val = input.value.trim().toUpperCase();
      if (val === 'MOON' || val === 'ЛУНА') {
        localStorage.setItem('solved', '1');
        stage.innerHTML = finalText;
      } else {
        fb.innerHTML = '<div class="wrong">это ложь.</div>';
        input.value = '';
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });
  }

  if (localStorage.getItem('solved') === '1') {
    stage.innerHTML = finalText;
  }
}

/* ===============================
   СБРОС: ?reset
   =============================== */
if (location.search.includes('reset')) {
  localStorage.clear();
  stage.innerHTML = '<span class="dim">[сброшено]</span>';
}
</script>
</body>
</html>
